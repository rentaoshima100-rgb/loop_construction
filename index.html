<style>
/* Loop建築 — Editorial Architectural site styles */

:root {
  /* Palette: clean, bright, trustworthy LIGHT MODE.
     White / off-white base × deep navy ink × low-saturation corporate blue.
     BtoB 向けの誠実さと、採用向けの風通しの良さを両立させる。 */
  --bg: #FFFFFF;            /* page background — pure white */
  --bg-cream: #F7F9FC;      /* elevated surface — cards, modal */
  --bg-deep: #EDF2F8;       /* deepest tint — heavy sections (still light) */
  --bg-stone: #E1E9F2;      /* mid-tone panel / hover */
  --ink: #17222E;           /* primary text — deep navy-black */
  --ink-soft: #51606F;      /* secondary text */
  --stone: #8492A1;         /* muted text */
  --stone-light: #A8B3BF;
  --rule: #E4E9F0;          /* border lines, subtle on light */
  --rule-soft: #D2DAE4;

  /* Primary accent — corporate blue. Low saturation, high trust. */
  --brand: #1D5FA8;
  --brand-deep: #16487F;
  --brand-soft: #4C86C4;
  --brand-pale: #E9F1FA;

  /* Secondary accent — restrained warm sand, used sparingly (採用まわり) */
  --sand: #B08356;
  --sand-pale: #F6EFE6;

  /* Back-compat aliases: 既存の下層ページが --orange 系を参照しているため、
     変数名は残したままブルーへ差し替える。新規コードは --brand を使うこと。 */
  --orange: var(--brand);
  --orange-deep: var(--brand-deep);
  --orange-soft: var(--brand-soft);

  --green: #5F8A70;
  --green-deep: #4B7159;
  --green-soft: #8FB09C;

  --shadow-soft: 0 1px 2px rgba(23,34,46,0.04), 0 8px 28px rgba(23,34,46,0.07);
  --shadow-lift: 0 2px 4px rgba(23,34,46,0.05), 0 18px 44px rgba(23,34,46,0.11);

  --font-serif: "Shippori Mincho", "Noto Serif JP", serif;
  --font-sans: "Zen Kaku Gothic New", "Noto Sans JP", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --font-latin: "Cormorant Garamond", "Shippori Mincho", serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-feature-settings: "palt" 1;
  /* 横スクロール抑止。overflow-x: hidden は position: sticky を無効化するため、
     対応ブラウザでは scroll container を作らない overflow-x: clip を使う。
     （clip 非対応ブラウザでは hidden にフォールバックする） */
  overflow-x: hidden;
  overflow-x: clip;
  max-width: 100vw;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

html { scroll-behavior: smooth; }

img { display: block; max-width: 100%; }

a {
  color: inherit;
  text-decoration: none;
  cursor: pointer;
}

button { font: inherit; color: inherit; }

/* ─── Reveal animations ──────────────────────────── */
.reveal {
  opacity: 0;
  transform: translateY(28px);
  transition: opacity 1.1s cubic-bezier(0.16, 1, 0.3, 1),
              transform 1.1s cubic-bezier(0.16, 1, 0.3, 1);
  transition-delay: var(--reveal-delay, 0ms);
  will-change: opacity, transform;
}
.reveal.is-visible {
  opacity: 1;
  transform: translateY(0);
}

.reveal-image {
  position: relative;
  overflow: hidden;
}
.reveal-image::after {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--bg);
  transform: translateX(0);
  transition: transform 1.4s cubic-bezier(0.77, 0, 0.175, 1);
  transition-delay: var(--reveal-delay, 0ms);
}
.reveal-image.is-visible::after {
  transform: translateX(101%);
}
.reveal-image img {
  transform: scale(1.15);
  transition: transform 2.2s cubic-bezier(0.16, 1, 0.3, 1);
  transition-delay: var(--reveal-delay, 0ms);
}
.reveal-image.is-visible img {
  transform: scale(1);
}

/* ─── Kinetic underline link ─────────────────────── */
.link-underline {
  position: relative;
  display: inline-block;
  padding-bottom: 2px;
}
.link-underline::after {
  content: '';
  position: absolute;
  left: 0; bottom: 0;
  width: 100%; height: 1px;
  background: currentColor;
  transform: scaleX(1);
  transform-origin: right center;
  transition: transform .5s cubic-bezier(0.77, 0, 0.175, 1);
}
.link-underline:hover::after {
  transform: scaleX(0);
  transform-origin: right center;
}
.link-underline::before {
  content: '';
  position: absolute;
  left: 0; bottom: 0;
  width: 100%; height: 1px;
  background: currentColor;
  transform: scaleX(0);
  transform-origin: left center;
  transition: transform .5s cubic-bezier(0.77, 0, 0.175, 1) .15s;
}
.link-underline:hover::before {
  transform: scaleX(1);
}

/* ─── Button: pill ──────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 16px;
  padding: 20px 36px;
  min-height: 60px;
  border-radius: 3px;
  font-family: var(--font-sans);
  font-size: 15px;
  letter-spacing: 0.08em;
  font-weight: 700;
  cursor: pointer;
  transition: transform .4s cubic-bezier(0.16, 1, 0.3, 1),
              background-color .3s, color .3s, border-color .3s, box-shadow .3s;
  border: 1px solid transparent;
  white-space: nowrap;
}
.btn--solid {
  background: var(--brand);
  color: #FFFFFF;
  box-shadow: 0 1px 2px rgba(29,95,168,0.16), 0 8px 20px rgba(29,95,168,0.16);
}
.btn--solid:hover {
  background: var(--brand-deep);
  box-shadow: 0 2px 4px rgba(29,95,168,0.18), 0 14px 30px rgba(29,95,168,0.22);
}
.btn--outline {
  background: #FFFFFF;
  color: var(--brand);
  border-color: var(--rule-soft);
}
.btn--outline:hover {
  border-color: var(--brand);
  background: var(--brand-pale);
}
/* legacy alias — 下層ページが btn--orange を参照している */
.btn--orange {
  background: var(--brand);
  color: #FFFFFF;
}
.btn--orange:hover {
  background: var(--brand-deep);
}
/* 白背景・写真上で使う反転ボタン */
.btn--ghost {
  background: rgba(255,255,255,0.14);
  color: #FFFFFF;
  border-color: rgba(255,255,255,0.55);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.btn--ghost:hover {
  background: #FFFFFF;
  color: var(--ink);
  border-color: #FFFFFF;
}
.btn .btn-arrow {
  display: inline-block;
  transition: transform .4s cubic-bezier(0.16, 1, 0.3, 1);
}
.btn:hover .btn-arrow {
  transform: translateX(4px);
}

/* ─── Image hover zoom ──────────────────────────── */
.img-zoom {
  overflow: hidden;
  position: relative;
}
.img-zoom img,
.img-zoom .img-inner {
  transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
}
.img-zoom:hover img,
.img-zoom:hover .img-inner {
  transform: scale(1.05);
}

/* ─── Page transition ──────────────────────────── */
/* fill-mode は backwards。both だと終了後も transform が残り、
   子孫の position: fixed / sticky の基準がこの要素になってしまう。 */
.page-enter {
  animation: pageEnter .8s cubic-bezier(0.16, 1, 0.3, 1) backwards;
}
@keyframes pageEnter {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ─── Custom cursor area (visual hint only) ─── */
.cursor-eye {
  position: absolute;
  pointer-events: none;
  width: 96px;
  height: 96px;
  border-radius: 50%;
  background: var(--orange);
  color: var(--bg-cream);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-latin);
  font-style: italic;
  font-size: 14px;
  letter-spacing: 0.02em;
  transform: translate(-50%, -50%) scale(0);
  transition: transform .35s cubic-bezier(0.16, 1, 0.3, 1);
  z-index: 5;
}
.cursor-eye-host:hover .cursor-eye {
  transform: translate(-50%, -50%) scale(1);
}

/* ─── Before/After slider ──────────────────────── */
.ba-slider {
  position: relative;
  overflow: hidden;
  user-select: none;
  cursor: ew-resize;
}
.ba-slider img {
  width: 100%; height: 100%;
  object-fit: cover;
  pointer-events: none;
  position: absolute; inset: 0;
}
.ba-after-clip {
  position: absolute; top: 0; bottom: 0; left: 0;
  overflow: hidden;
}
.ba-handle {
  position: absolute;
  top: 0; bottom: 0;
  width: 2px;
  background: var(--bg-cream);
  transform: translateX(-50%);
  pointer-events: none;
}
.ba-handle::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 56px; height: 56px;
  border-radius: 50%;
  background: var(--bg-cream);
  transform: translate(-50%, -50%);
  box-shadow: 0 4px 24px rgba(28,25,23,0.25);
}
.ba-handle::after {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  width: 16px; height: 16px;
  border: 2px solid var(--ink);
  border-top: 0; border-right: 0;
  transform: translate(-100%, -50%) rotate(45deg);
  margin-left: -2px;
}
.ba-label {
  position: absolute;
  top: 24px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.2em;
  color: var(--bg-cream);
  background: rgba(28,25,23,0.7);
  padding: 6px 12px;
  z-index: 3;
  pointer-events: none;
}

/* ─── Nav scroll states ──────────────────────── */
.nav-root {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  transition: background-color .35s, border-color .35s, padding .35s;
}
.nav-root.is-scrolled {
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--rule);
}

/* ─── Mobile menu overlay ──────────────────────── */
.menu-overlay {
  position: fixed; inset: 0;
  background: var(--bg-deep);
  color: var(--ink);
  z-index: 200;
  display: flex;
  flex-direction: column;
  padding: 56px;
  transform: translateY(-100%);
  transition: transform .8s cubic-bezier(0.77, 0, 0.175, 1);
}
.menu-overlay.is-open {
  transform: translateY(0);
}

/* ─── Inquiry modal ─────────────────────────────── */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(28,25,23,0.7);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 300;
  opacity: 0;
  transition: opacity .4s;
  pointer-events: none;
  display: flex;
  align-items: stretch;
  justify-content: flex-end;
}
.modal-backdrop.is-open {
  opacity: 1;
  pointer-events: auto;
}
.modal-panel {
  width: 720px;
  max-width: 100%;
  background: var(--bg-cream);
  transform: translateX(100%);
  transition: transform .6s cubic-bezier(0.77, 0, 0.175, 1);
  overflow-y: auto;
}

@media (max-width: 720px) {
  .modal-panel { width: 100%; }
  .modal-panel > div { padding-left: 20px !important; padding-right: 20px !important; }
}
.modal-backdrop.is-open .modal-panel {
  transform: translateX(0);
}

/* ─── Hero slider ───────────────────────────────── */
.hero-slide {
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity 1.6s cubic-bezier(0.4, 0, 0.2, 1);
}
.hero-slide.is-active {
  opacity: 1;
}
.hero-slide img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scale(1);
  transition: transform 8s linear;
}
.hero-slide.is-active img {
  transform: scale(1.08);
}

/* ─── Tiny utility ──────────────────────────────── */
/* 画面には出さず、読み上げ・検索エンジンにだけ渡すテキスト */
.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  margin: -1px; padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

.wrap { padding-left: 56px; padding-right: 56px; }
.wrap-tight { padding-left: 80px; padding-right: 80px; }

@media (max-width: 920px) {
  .wrap, .wrap-tight { padding-left: 24px; padding-right: 24px; }
}

/* ─── Page focus ring (for click states) ──────── */
*:focus-visible {
  outline: 2px solid var(--orange);
  outline-offset: 3px;
}

/* ─────────────────────────────────────────────────────────────────────
   "Passing" animation — preserved from the original site.
   A solid bar slides L→R across the text, then disappears off the right.
   Text fades in at the midpoint when the bar fully covers it.
   ───────────────────────────────────────────────────────────────────── */
.passing {
  display: inline-block;
}
.passing-box {
  display: block;
}
.passing-bar {
  display: inline-block;
  position: relative;
  transform: translate3d(0, 0, 0);
}
.passing-bar::before {
  content: '';
  background: var(--ink);
  display: inline-block;
  width: 0;
  height: 100%;
  position: absolute;
  left: 0;
  top: 0;
  z-index: 1;
}
.passing.is-light .passing-bar::before {
  background: var(--bg-cream);
}
.passing.is-brass .passing-bar::before {
  background: var(--orange);
}
.passing-txt {
  opacity: 0;
  transform: translate3d(0, 0, 0);
  position: relative;
  z-index: 0;
}
.passing.is-active .passing-bar::before {
  animation: passing-bar 1s ease 0s 1 normal forwards;
}
.passing.is-active .passing-txt {
  animation: passing-txt 0s ease .5s 1 normal forwards;
}

@keyframes passing-bar {
  0%   { left: 0;    width: 0;    }
  50%  { left: 0;    width: 100%; }
  51%  { left: 0;    width: 100%; }
  100% { left: 100%; width: 0;    }
}
@keyframes passing-txt {
  0%   { opacity: 0; }
  50%  { opacity: 0; }
  100% { opacity: 1; }
}

/* ─────────────────────────────────────────────────────────────────────
   Mask reveal — text rises from below behind a clipped edge.
   No visible bar color — the parent simply clips an inner span that
   translates from translateY(112%) → 0.
   ───────────────────────────────────────────────────────────────────── */
.mask-reveal {
  display: inline-block;
  position: relative;
  overflow: hidden;
  /* small overflow buffer so descenders aren't clipped while resting */
  padding-bottom: 0.08em;
  margin-bottom: -0.08em;
  vertical-align: top;
}
.mask-reveal-inner {
  display: inline-block;
  transform: translateY(112%);
  transition: transform 1.3s cubic-bezier(0.77, 0, 0.175, 1);
  transition-delay: var(--mask-delay, 0ms);
  will-change: transform;
}
.mask-reveal.is-active .mask-reveal-inner {
  transform: translateY(0);
}
/* Narrow-viewport safety: let big headings wrap instead of being clipped by overflow-x:hidden */
.mask-reveal, .mask-reveal-inner { max-width: 100%; }
h1, h2, h3 { overflow-wrap: anywhere; word-break: break-word; }


/* hero pulse */
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scaleX(1); }
  50% { opacity: 0.4; transform: scaleX(0.5); transform-origin: left; }
}

/* ─────────────────────────────────────────────────────────────────────
   Light redesign utilities (2026) — 白基調・信頼感・余白広め
   ───────────────────────────────────────────────────────────────────── */

/* Lift card — 事業内容 / 施工事例 / 強み で共通利用 */
.card-lift {
  background: #FFFFFF;
  border: 1px solid var(--rule);
  border-radius: 4px;
  overflow: hidden;
  transition: transform .5s cubic-bezier(0.16, 1, 0.3, 1),
              box-shadow .5s cubic-bezier(0.16, 1, 0.3, 1),
              border-color .4s;
}
.card-lift:hover {
  transform: translateY(-5px);
  box-shadow: var(--shadow-lift);
  border-color: var(--brand-soft);
}

/* クリックできるカード（強み → 施工実績へ） */
.card-action {
  text-decoration: none;
  color: inherit;
}
.card-action .card-action-arrow {
  display: inline-block;

@media (prefers-reduced-motion: reduce) {

  .reveal {
    transform: none !important;

  }

    transition: opacity .55s ease !important;
  }
  .mask-reveal.is-active .mask-reveal-inner { opacity: 1; }

  /* 画像のワイプ＋ズームはフェードに置き換え */
  .reveal-image::after { transition: opacity .5s ease !important; transform: translateX(101%) !important; opacity: 1; }
  .reveal-image.is-visible::after { opacity: 0; }

  /* ページ遷移は移動なしのフェードに */
  .page-enter { animation: pageEnterFade .5s ease backwards; }

  /* ホバーで浮き上がる動きは抑制（色の変化は残す） */
  .card-lift:hover, .cat-btn:hover { transform: none !important; }

  /* 流れ続ける・自動で動く要素は止める */
  .hero-slide img { animation: none !important; transform: none !important; }

  html { scroll-behavior: auto; }
}

@keyframes pageEnterFade {
  from { opacity: 0; }
  to   { opacity: 1; }
}

<script type="text/babel" data-presets="react">

/* ─── src/primitives.jsx ─── */
// Loop建築 — shared utilities & primitives

const { useState, useEffect, useRef, useContext, createContext, useCallback, useMemo } = React;

// ─── Router (state-based) ────────────────────────────────────────────────
const RouterContext = createContext({ route: 'home', go: () => {} });

function RouterProvider({ children }) {
  const [route, setRoute] = useState(() => {
    if (typeof window === 'undefined') return 'home';
    return (location.hash || '#home').replace('#', '') || 'home';
  });
  const [inquiryOpen, setInquiryOpen] = useState(false);
  // 施工実績ページで開くカテゴリ（トップの事業ボタンから指定される）
  const [worksCat, setWorksCat] = useState(null);
  // 事業案内ページで開くセクション（トップの事業カードから指定される）
  const [bizSec, setBizSec] = useState(null);

  useEffect(() => {
    const onHash = () => setRoute((location.hash || '#home').replace('#', '') || 'home');
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  const go = useCallback((r, opt) => {
    if (r === 'inquiry') { setInquiryOpen(true); return; }
    setWorksCat(opt && opt.cat ? opt.cat : null);
    setBizSec(opt && opt.sec ? opt.sec : null);
    if ((location.hash || '#home').replace('#', '') === r) {
      // 同じルート内での指定はハッシュが変わらないため、手動で再通知する
      setRoute(r);
    }
    location.hash = '#' + r;
    window.scrollTo({ top: 0, behavior: 'instant' });
  }, []);

  const value = useMemo(
    () => ({ route, go, inquiryOpen, setInquiryOpen, worksCat, setWorksCat, bizSec, setBizSec }),
    [route, inquiryOpen, worksCat, bizSec]
  );
  return <RouterContext.Provider value={value}>{children}</RouterContext.Provider>;
}

const useRouter = () => useContext(RouterContext);

// ─── Viewport / breakpoint hook ──────────────────────────────────────────
function useMobile(breakpoint = 860) {
  const [isMobile, setIsMobile] = useState(() =>
    typeof window !== 'undefined' && window.innerWidth < breakpoint
  );
  useEffect(() => {
    const onResize = () => setIsMobile(window.innerWidth < breakpoint);
    window.addEventListener('resize', onResize);
    onResize();
    return () => window.removeEventListener('resize', onResize);
  }, [breakpoint]);
  return isMobile;
}

// ─── IntersectionObserver-based reveal ────────────────────────────────────
function useReveal(opts = {}) {  const ref = useRef(null);
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting) {
        setVisible(true);
        io.disconnect();
      }
    }, { threshold: opts.threshold || 0.12, rootMargin: opts.rootMargin || '0px 0px -8% 0px' });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return [ref, visible];
}

function Reveal({ children, delay = 0, as: As = 'div', className = '', style = {}, kind = '' }) {
  const [ref, visible] = useReveal();
  const cls = `${kind === 'image' ? 'reveal-image' : 'reveal'} ${visible ? 'is-visible' : ''} ${className}`;
  return (
    <As ref={ref} className={cls} style={{ ...style, '--reveal-delay': delay + 'ms' }}>
      {children}
    </As>
  );
}

// ─── Buttons ─────────────────────────────────────────────────────────────
function Btn({ children, variant = 'solid', onClick, ...rest }) {
  return (
    <button data-nq-id="sk3i4ofv" className={`btn btn--${variant}`} onClick={onClick} {...rest}>
      <span data-nq-id="xwhuoj6w">{children}</span>
      <span data-nq-id="1c5gquyt" className="btn-arrow">→</span>
    </button>
  );
}

// ─── Section label (en — jp) — simple inline label, no visible bar
function SectionLabel({ en, jp, color = 'var(--orange)' }) {
  return (
    <div data-nq-id="9e4o9b49" style={{
      fontFamily: 'var(--font-latin)', fontStyle: 'italic',
      fontSize: 22, color, letterSpacing: '0.02em',
      marginBottom: 12,
    }}>— {en}{jp ? <span data-nq-id="zoxgrao5" style={{ color: 'var(--stone)', fontFamily: 'var(--font-sans)', fontStyle: 'normal', fontSize: 12, marginLeft: 16, letterSpacing: '0.16em' }}>{jp}</span> : null}</div>
  );
}

// ─── Passing — bar sweeps L→R across the text, text fades in at midpoint.
//     Preserved from the original site's signature animation.
function Passing({ children, variant = 'dark', as: As = 'span', className = '', style = {} }) {
  const [ref, visible] = useReveal({ threshold: 0.4 });
  const variantCls = variant === 'light' ? 'is-light' : variant === 'brass' ? 'is-brass' : '';
  return (
    <As ref={ref} className={`passing ${variantCls} ${visible ? 'is-active' : ''} ${className}`} style={style}>
      <span className="passing-box">
        <span className="passing-bar">
          <span data-nq-id="i7kzh94f" className="passing-txt">{children}</span>
        </span>
      </span>
    </As>
  );
}

// ─── MaskReveal — text rises into view behind a clipped edge (no visible bar).
function MaskReveal({ children, as: As = 'span', className = '', style = {}, delay = 0 }) {
  const [ref, visible] = useReveal({ threshold: 0.25 });
  return (
    <As ref={ref} className={`mask-reveal ${visible ? 'is-active' : ''} ${className}`} style={style}>
      <span data-nq-id="lhigi7g0" className="mask-reveal-inner" style={{ '--mask-delay': delay + 'ms' }}>
        {children}
      </span>
    </As>
  );
}

// ─── Before/After slider ─────────────────────────────────────────────────
function BeforeAfter({ before, after, label = 'Before · After', height = 540 }) {
  const ref = useRef(null);
  const [pos, setPos] = useState(50);
  const dragging = useRef(false);

  useEffect(() => {
    const move = (e) => {
      if (!dragging.current || !ref.current) return;
      const r = ref.current.getBoundingClientRect();
      const x = ((e.touches ? e.touches[0].clientX : e.clientX) - r.left) / r.width * 100;
      setPos(Math.max(0, Math.min(100, x)));
    };
    const up = () => dragging.current = false;
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
    window.addEventListener('touchmove', move);
    window.addEventListener('touchend', up);
    return () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
      window.removeEventListener('touchmove', move);
      window.removeEventListener('touchend', up);
    };
  }, []);

  return (
    <div
      ref={ref}
      className="ba-slider"
      style={{ height }}
      onMouseDown={(e) => {
        dragging.current = true;
        const r = ref.current.getBoundingClientRect();
        setPos(((e.clientX - r.left) / r.width) * 100);
      }}
      onTouchStart={(e) => {
        dragging.current = true;
        const r = ref.current.getBoundingClientRect();
        setPos(((e.touches[0].clientX - r.left) / r.width) * 100);
      }}
    >
      <img data-nq-id="xetb2pej" src={before} alt="Before" />
      <div className="ba-after-clip" style={{ width: pos + '%' }}>
        <img data-nq-id="il7wp4go" src={after} alt="After" style={{ width: ref.current?.offsetWidth || '100%', height: '100%' }} />
      </div>
      <div data-nq-id="aoldneu1" className="ba-label" style={{ left: 24 }}>BEFORE</div>
      <div data-nq-id="e482ny8m" className="ba-label" style={{ right: 24 }}>AFTER</div>
      <div className="ba-handle" style={{ left: pos + '%' }} />
    </div>
  );
}

// ─── Parallax-light image with subtle scroll movement ───────────────────
function ParallaxImage({ src, alt = '', strength = 30, style, imgStyle, loading = 'lazy' }) {
  const ref = useRef(null);
  const [offset, setOffset] = useState(0);
  useEffect(() => {
    // OS 側で「視差効果を減らす」が有効なときは動かさない
    const reduce = typeof window.matchMedia === 'function'
      && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) return;
    let raf;
    const onScroll = () => {
      raf && cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => {
        if (!ref.current) return;
        const r = ref.current.getBoundingClientRect();
        const vh = window.innerHeight;
        const p = (r.top + r.height / 2 - vh / 2) / vh;
        setOffset(-p * strength);
      });
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return () => {
      window.removeEventListener('scroll', onScroll);
      raf && cancelAnimationFrame(raf);
    };
  }, [strength]);
  return (
    <div ref={ref} style={{ overflow: 'hidden', ...style }}>
      <img data-nq-id="p5l0b6fv"
        src={src} alt={alt} loading={loading}
        style={{
          width: '100%', height: '100%', objectFit: 'cover',
          ...imgStyle,
          transform: `translateY(${offset}px) scale(1.08)`,
          willChange: 'transform',
        }}
      />
    </div>
  );
}

// ─── Tiny FIG. metadata block ───────────────────────────────────────────
function FigMeta({ no, label, year, side = 'left', color = 'var(--bg-cream)' }) {

    </div>

}

//     実写真をご支給いただき次第、img に差し替える箇所。

    </div>

}

window.PhotoPending = PhotoPending;
window.RouterProvider = RouterProvider;

/* ─── src/nav.jsx ─── */

// Loop建築 — Inquiry modal + main App

// ─── お問い合わせの送信先 ────────────────────────────────────────────
//     GitHub Pages は静的ホスティングのため、送信はフォームサービスに預ける。
//     Formspree / SSGform などで発行したエンドポイントURLをここに入れると
//     そのままPOST送信が有効になる。
//     空のままの場合は、メールソフトを起動する方式にフォールバックする
//     （＝送信できたふりをせず、必ず担当者に届く経路を残す）。
const FORM_ENDPOINT = '';
const INQUIRY_MAILTO = 'loop_kanri@kabuloop.sakura.ne.jp';

const INQUIRY_LABELS = {
  type: 'ご相談の種類', building: '建物の種類', size: '規模', issue: '主なご相談内容',
  name: 'お名前', org: '所属 / 法人名', email: 'メールアドレス',
  phone: '電話番号', message: 'その他ご要望',
};

const buildInquiryBody = (data) =>
  Object.keys(INQUIRY_LABELS)
    .map((k) => `${INQUIRY_LABELS[k]}：${data[k] || '（未記入）'}`)
    .join('\n');

const isValidEmail = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);

function InquiryModal() {
  const { inquiryOpen, setInquiryOpen } = useRouter();
  const [step, setStep] = useState(1);
  const [data, setData] = useState({
    type: '', building: '', size: '', issue: '',
    name: '', org: '', email: '', phone: '', message: '',
  });
  const [submitted, setSubmitted] = useState(false);
  const [sending, setSending] = useState(false);
  const [error, setError] = useState('');
  const [viaMail, setViaMail] = useState(false);

  useEffect(() => {
    if (inquiryOpen) {
      document.body.style.overflow = 'hidden';
      setStep(1);
      setSubmitted(false);
      setSending(false);
      setError('');
      setViaMail(false);
    } else {
      document.body.style.overflow = '';
    }
  }, [inquiryOpen]);

  const update = (k, v) => setData(d => ({ ...d, [k]: v }));
  const canContinue1 = data.type && data.building;
  const canContinue2 = data.name && isValidEmail(data.email);

  const submit = async () => {
    if (sending) return;
    setError('');

    // エンドポイント未設定時：メールソフトを起動して確実に届ける
    if (!FORM_ENDPOINT) {
      const subject = `【お問い合わせ】${data.type || 'ご相談'}／${data.name || ''} 様`;
      window.location.href = `mailto:${INQUIRY_MAILTO}`
        + `?subject=${encodeURIComponent(subject)}`
        + `&body=${encodeURIComponent(buildInquiryBody(data))}`;
      setViaMail(true);
      setSubmitted(true);
      return;
    }

    setSending(true);
    try {
      const res = await fetch(FORM_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({
          ...data,
          _subject: `【お問い合わせ】${data.type}／${data.name} 様`,
          送信元: 'コーポレートサイト お問い合わせフォーム',
        }),
      });
      if (!res.ok) throw new Error(`status ${res.status}`);
      setSubmitted(true);
    } catch (e) {
      setError('送信に失敗しました。時間をおいて再度お試しいただくか、'
        + 'お電話（06-6394-7778）にてご連絡ください。');
    } finally {
      setSending(false);
    }
  };

  return (
    <div className={`modal-backdrop ${inquiryOpen ? 'is-open' : ''}`} onClick={() => setInquiryOpen(false)}>
      <div className="modal-panel" onClick={(e) => e.stopPropagation()}>
        {/* Header */}
        <div style={{
          padding: '32px 48px', borderBottom: '1px solid var(--rule)',
          display: 'flex', justifyContent: 'space-between', alignItems: 'center',
          position: 'sticky', top: 0, background: 'var(--bg-cream)', zIndex: 1,
        }}>
          <div>
            <div data-nq-id="ee69kmdh" style={{
              fontFamily: 'var(--font-latin)', fontStyle: 'italic', fontSize: 18,
              color: 'var(--orange)', letterSpacing: '0.02em',
            }}>— Get in touch</div>
            <h2 data-nq-id="vnsm831m" style={{
              fontFamily: 'var(--font-serif)', fontSize: 32, fontWeight: 500,
              margin: '2px 0 0', color: 'var(--ink)', letterSpacing: '-0.01em',
            }}>無料現地調査・お見積り</h2>
            <p style={{
              fontFamily: 'var(--font-sans)', fontSize: 12,
              color: '#8492a1', margin: '12px 0 0',
            }}>こちらのフォームから弊社への営業目的のご連絡はご遠慮ください</p>
          </div>
          <button data-nq-id="iqbka7va" onClick={() => setInquiryOpen(false)} style={{
            width: 40, height: 40, borderRadius: '50%', border: '1px solid var(--rule)',
            background: 'transparent', cursor: 'pointer', display: 'flex',
            alignItems: 'center', justifyContent: 'center',
            transition: 'background-color .2s, color .2s',
          }}
            onMouseEnter={(e) => { e.currentTarget.style.backgroundColor = 'var(--ink)'; e.currentTarget.style.color = 'var(--bg-cream)'; }}
            onMouseLeave={(e) => { e.currentTarget.style.backgroundColor = ''; e.currentTarget.style.color = ''; }}
          >
            <span data-nq-id="ety69muw" style={{ fontSize: 18, lineHeight: 1 }}>×</span>
          </button>
        </div>

        {submitted ? (
          <div style={{ padding: '96px 48px', textAlign: 'center' }}>
            <div data-nq-id="zfljn9v9" style={{
              width: 72, height: 72, borderRadius: '50%', background: 'var(--orange)',
              color: 'var(--bg-cream)', margin: '0 auto 32px',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              fontFamily: 'var(--font-serif)', fontSize: 36,
            }}>✓</div>
            <h3 data-nq-id="28kz8szl" style={{
              fontFamily: 'var(--font-serif)', fontSize: 32, fontWeight: 500,
              margin: 0, color: 'var(--ink)',
            }}>{viaMail ? 'メールソフトを開きました' : '送信されました'}</h3>
            <p data-nq-id="eegt1jm9" style={{
              fontFamily: 'var(--font-sans)', fontSize: 14, lineHeight: 2,
              color: 'var(--ink-soft)', marginTop: 16, letterSpacing: '0.04em',
            }}>
              {viaMail ? (
                <>
                  ご入力内容を差し込んだメールを作成しました。<br />
                  内容をご確認のうえ、そのまま送信してください。<br />
                  メールソフトが開かない場合は、お手数ですが<br />
                  <a data-nq-id="hzph10h6" href={`mailto:${INQUIRY_MAILTO}`} className="link-underline"
                    style={{ color: 'var(--brand)', fontWeight: 700 }}>{INQUIRY_MAILTO}</a>
                  {' '}宛にご連絡ください。
                </>
              ) : (
                <>
                  お問い合わせありがとうございます。<br />
                  担当者より2営業日以内にご連絡いたします。
                </>
              )}
            </p>
            <button data-nq-id="dq064ngc" onClick={() => setInquiryOpen(false)} className="btn btn--outline" style={{ marginTop: 36 }}>
              <span data-nq-id="np9lxqdh">閉じる</span>
              <span data-nq-id="gqgp5vik" className="btn-arrow">→</span>
            </button>
          </div>
        ) : (
          <>
            {/* Step indicator */}
            <div style={{ padding: '24px 48px', display: 'flex', gap: 16 }}>
              {[1, 2, 3].map(s => (
                <div key={s} style={{
                  flex: 1, height: 2, background: s <= step ? 'var(--orange)' : 'var(--rule)',
                  transition: 'background-color .4s',
                }} />
              ))}
            </div>
            <div style={{
              padding: '8px 48px 16px', display: 'flex', justifyContent: 'space-between',
              fontFamily: 'var(--font-mono)', fontSize: 10, color: 'var(--stone)',
              letterSpacing: '0.22em',
            }}>
              <span data-nq-id="5sjw1lx5">STEP {step} / 3</span>
              <span data-nq-id="g78dq1i5">{step === 1 ? '建物について' : step === 2 ? '連絡先' : '確認'}</span>
            </div>

            {step === 1 && (
              <div style={{ padding: '24px 48px 48px' }}>
                <FormGroup label="ご相談の種類" en="Type">
                  <Radios value={data.type} onChange={(v) => update('type', v)} options={[
                    '新築工事', '大規模修繕', '公共工事', '派遣事業（施工管理）', '道路維持・保全事業', 'その他',
                  ]} />
                </FormGroup>
                <FormGroup label="建物の種類" en="Building type">
                  <Radios value={data.building} onChange={(v) => update('building', v)} options={[
                    '分譲マンション', '賃貸マンション / 社宅', '店舗 / クリニック', 'ビル / 商業施設', '公共施設 / 学校', 'その他',
                  ]} />
                </FormGroup>
                <FormGroup label="規模" en="Scale" optional>
                  <Radios value={data.size} onChange={(v) => update('size', v)} options={[
                    '〜30戸 / 〜1,000㎡', '30〜100戸 / 〜10,000㎡', '100戸〜 / 10,000㎡〜', '未定 / 相談',
                  ]} />
                </FormGroup>
                <FormGroup label="主なご相談内容" en="Main concern" optional>
                  <textarea value={data.issue} onChange={(e) => update('issue', e.target.value)}
                    rows={4} placeholder="例：築20年で外壁の劣化が気になっている / 屋上からの雨漏りが発生 / 長期修繕計画について"
                    style={inputStyle} />
                </FormGroup>
                <ModalNav onNext={() => setStep(2)} nextDisabled={!canContinue1} />
              </div>
            )}

            {step === 2 && (
              <div style={{ padding: '24px 48px 48px' }}>
                <FormGroup label="お名前" en="Name">
                  <input value={data.name} onChange={(e) => update('name', e.target.value)}
                    placeholder="山田 太郎" style={inputStyle} />
                </FormGroup>
                <FormGroup label="所属 / 法人名" en="Organization" optional>
                  <input value={data.org} onChange={(e) => update('org', e.target.value)}
                    placeholder="◯◯マンション管理組合 / 株式会社◯◯" style={inputStyle} />
                </FormGroup>
                <FormGroup label="メールアドレス" en="Email">
                  <input type="email" value={data.email} onChange={(e) => update('email', e.target.value)}
                    placeholder="taro@example.com" style={inputStyle}
                    aria-invalid={data.email !== '' && !isValidEmail(data.email)} />
                  {data.email !== '' && !isValidEmail(data.email) && (
                    <div data-nq-id="sfnxiz5t" style={{
                      fontFamily: 'var(--font-sans)', fontSize: 12, color: '#B4443A',
                      marginTop: 8, letterSpacing: '0.03em',
                    }}>メールアドレスの形式をご確認ください。</div>
                  )}
                </FormGroup>
                <FormGroup label="電話番号" en="Phone" optional>
                  <input value={data.phone} onChange={(e) => update('phone', e.target.value)}
                    placeholder="090-0000-0000" style={inputStyle} />
                </FormGroup>
                <FormGroup label="その他ご要望" en="Other notes" optional>
                  <textarea value={data.message} onChange={(e) => update('message', e.target.value)}
                    rows={3} placeholder="ご希望の連絡時間帯、その他補足" style={inputStyle} />
                </FormGroup>
                <ModalNav onBack={() => setStep(1)} onNext={() => setStep(3)} nextDisabled={!canContinue2} />
              </div>
            )}

            {step === 3 && (
              <div style={{ padding: '24px 48px 48px' }}>
                <div style={{
                  background: 'var(--bg)', padding: 32, border: '1px solid var(--rule)',
                }}>
                  <div data-nq-id="x65hat3e" style={{
                    fontFamily: 'var(--font-mono)', fontSize: 10, color: 'var(--stone)',
                    letterSpacing: '0.22em', marginBottom: 24,
                  }}>SUMMARY</div>
                  {[
                    ['ご相談の種類', data.type],
                    ['建物の種類', data.building],
                    ['規模', data.size || '—'],
                    ['ご相談内容', data.issue || '—'],
                    ['お名前', data.name],
                    ['所属', data.org || '—'],
                    ['メール', data.email],
                    ['電話', data.phone || '—'],
                    ['その他', data.message || '—'],
                  ].map(([k, v]) => (
                    <div key={k} style={{
                      padding: '12px 0', borderBottom: '1px solid var(--rule)',
                      display: 'grid', gridTemplateColumns: '140px 1fr', gap: 16,
                      fontFamily: 'var(--font-sans)', fontSize: 13.5, color: 'var(--ink)',
                    }}>
                      <span data-nq-id="km024lnm" style={{ color: 'var(--stone)', fontSize: 11.5, letterSpacing: '0.06em' }}>{k}</span>
                      <span data-nq-id="fpoolqdo" style={{ fontFamily: 'var(--font-serif)', fontSize: 15, lineHeight: 1.6 }}>{v}</span>
                    </div>
                  ))}
                </div>
                <p data-nq-id="axgrr8qg" style={{
                  fontFamily: 'var(--font-sans)', fontSize: 12, color: 'var(--stone)',
                  marginTop: 24, lineHeight: 1.9, letterSpacing: '0.04em',
                }}>
                  ※ 担当者より2営業日以内にご連絡いたします。<br />
                  ※ 現地調査・お見積りは無料です。
                </p>
                {error && (
                  <div data-nq-id="pp0qsrkx" role="alert" style={{
                    marginTop: 20, padding: '14px 16px', borderRadius: 4,
                    background: '#FDF1F0', border: '1px solid #EBC6C2',
                    fontFamily: 'var(--font-sans)', fontSize: 13, lineHeight: 1.9,
                    color: '#8E332B', letterSpacing: '0.03em',
                  }}>{error}</div>
                )}
                <ModalNav
                  onBack={() => setStep(2)}
                  onNext={submit}
                  nextDisabled={sending}
                  nextLabel={sending ? '送信中…' : (FORM_ENDPOINT ? 'この内容で送信' : 'メールソフトで送信')}
                />
              </div>
            )}
          </>
        )}
      </div>
    </div>
  );
}

const inputStyle = {
  width: '100%', padding: '12px 16px',
  background: 'var(--bg)', border: '1px solid var(--rule)',
  fontFamily: 'var(--font-serif)', fontSize: 15, color: 'var(--ink)',
  outline: 'none', resize: 'vertical',
};

function FormGroup({ label, en, optional, children }) {
  return (
    <div data-nq-id="iv2rez72" style={{ marginBottom: 28 }}>
      <div style={{
        display: 'flex', alignItems: 'baseline', gap: 12, marginBottom: 10,
      }}>
        <span data-nq-id="q7hb7aus" style={{
          fontFamily: 'var(--font-serif)', fontSize: 16, fontWeight: 500, color: 'var(--ink)',
        }}>{label}</span>
        <span data-nq-id="30ni6u3n" style={{
          fontFamily: 'var(--font-latin)', fontStyle: 'italic', fontSize: 13, color: 'var(--orange)',
        }}>{en}</span>
        {optional && (
          <span data-nq-id="0asegq2a" style={{
            marginLeft: 'auto', fontFamily: 'var(--font-mono)', fontSize: 9.5,
            color: 'var(--stone)', letterSpacing: '0.22em',
          }}>OPTIONAL</span>
        )}
        {!optional && (
          <span data-nq-id="cu5p1tlx" style={{
            marginLeft: 'auto', fontFamily: 'var(--font-mono)', fontSize: 9.5,
            color: 'var(--orange)', letterSpacing: '0.22em',
          }}>REQUIRED</span>
        )}
      </div>
      {children}
    </div>
  );
}

function Radios({ value, onChange, options }) {
  return (
    <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
      {options.map(opt => (
        <button data-nq-id="a08vl896" key={opt} onClick={() => onChange(opt)} style={{
          padding: '10px 16px', cursor: 'pointer',
          background: value === opt ? 'var(--ink)' : 'transparent',
          color: value === opt ? 'var(--bg-cream)' : 'var(--ink)',
          border: `1px solid ${value === opt ? 'var(--ink)' : 'var(--rule)'}`,
          fontFamily: 'var(--font-sans)', fontSize: 13,
          transition: 'all .2s',
        }}>{opt}</button>
      ))}
    </div>
  );
}

function ModalNav({ onBack, onNext, nextDisabled, nextLabel = '次へ' }) {
  return (
    <div style={{
      display: 'flex', justifyContent: 'space-between', marginTop: 36,
      paddingTop: 24, borderTop: '1px solid var(--rule)',
    }}>
      {onBack ? (
        <button data-nq-id="boh8j49a" onClick={onBack} className="btn btn--outline" style={{ padding: '14px 22px' }}>
          <span data-nq-id="i09e6irq" style={{ transform: 'scaleX(-1)', display: 'inline-block' }}>→</span>
          <span data-nq-id="zbyf7g4w">戻る</span>
        </button>
      ) : <span />}
      <button data-nq-id="qiea9tps" onClick={onNext} disabled={nextDisabled} className={`btn ${nextDisabled ? 'btn--outline' : 'btn--orange'}`} style={{
        padding: '14px 22px', opacity: nextDisabled ? 0.4 : 1,
        cursor: nextDisabled ? 'not-allowed' : 'pointer',
      }}>
        <span data-nq-id="kj122bvi">{nextLabel}</span>
        <span data-nq-id="a11ebizr" className="btn-arrow">→</span>
      </button>
    </div>
  );
}

// ─── App shell ──────────────────────────────────────────────────────────
function App() {
  return (
    <RouterProvider>
      <Shell />
    </RouterProvider>
  );
}

function Shell() {
  const { route } = useRouter();
  let page = null;
  switch (route) {
    case 'home':     page = <HomePage />;     break;
    case 'company':  page = <CompanyPage />;  break;
    case 'business': page = <BusinessPage />; break;
    case 'works':    page = <WorksPage />;    break;
    case 'news':     page = <NewsPage />;     break;
    case 'recruit':  page = <RecruitPage />;  break;
    case 'privacy':  page = <PrivacyPage />;  break;
    default:         page = <HomePage />;
  }
  return (
    <>
      <Nav />
      <main key={route}>{page}</main>
      <Footer />
      <InquiryModal />
    </>
  );
}

window.App = App;

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
