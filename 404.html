<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>ページが見つかりません｜株式会社ループ</title>
<link rel="icon" href="/loop_construction/assets/favicon.ico" sizes="48x48" />
<link rel="icon" type="image/png" sizes="32x32" href="/loop_construction/assets/favicon-32.png" />
<link rel="apple-touch-icon" href="/loop_construction/assets/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #FFFFFF; --ink: #17222E; --ink-soft: #51606F;
  --rule: #E4E9F0; --brand: #1D5FA8; --brand-deep: #16487F;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: "Zen Kaku Gothic New", "Noto Sans JP", -apple-system, system-ui, sans-serif;
  display: flex; align-items: center; justify-content: center;
  padding: 24px; text-align: center;
  border-top: 10px solid var(--brand); border-bottom: 10px solid var(--brand);
  min-height: 100vh;
}
.code {
  font-family: "Cormorant Garamond", serif; font-size: 96px; font-weight: 400;
  color: var(--brand); letter-spacing: 0.08em; line-height: 1;
}
h1 {
  font-family: "Shippori Mincho", serif; font-size: 26px; font-weight: 700;
  margin: 18px 0 14px; letter-spacing: 0.06em;
}
p { font-size: 14px; color: var(--ink-soft); line-height: 2; }
.rule { width: 56px; height: 2px; background: var(--rule); margin: 26px auto; }
a.btn {
  display: inline-block; margin-top: 4px; padding: 14px 36px;
  background: var(--brand); color: #fff; text-decoration: none;
  font-size: 14px; font-weight: 700; letter-spacing: 0.1em;
  transition: background .25s;
}
a.btn:hover { background: var(--brand-deep); }
.logo { width: 88px; height: auto; margin: 0 auto 26px; }
</style>
</head>
<body>
<main>
  <img class="logo" src="/loop_construction/assets/logo-loop.png" alt="株式会社ループ" />
  <div class="code">404</div>
  <h1>ページが見つかりません</h1>
  <p>お探しのページは移動または削除された可能性があります。<br />お手数ですが、トップページからご覧ください。</p>
  <div class="rule"></div>
  <a class="btn" href="/loop_construction/">トップページへ戻る</a>
</main>
</body>
</html>
